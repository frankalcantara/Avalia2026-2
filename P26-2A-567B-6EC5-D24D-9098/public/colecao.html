<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coleção pública · Bookmark Manager</title>
  <meta name="description" content="Coleção pública de links compartilhada no Bookmark Manager.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/">Bookmark Manager</a>
    </div>
  </header>

  <main id="main" class="page page--narrow" tabindex="-1">

    <p id="publicState" class="state state--loading" role="status">Carregando coleção…</p>

    <article id="publicView" class="public" aria-labelledby="publicTitle" hidden>
      <header class="public__head">
        <h1 id="publicTitle" class="public__title"></h1>
        <p id="publicDesc" class="public__desc" hidden></p>
        <p class="author">
          <img id="ownerAvatar" class="avatar" src="" alt="" width="36" height="36">
          <span>Coleção de <strong id="ownerName" class="author__name"></strong></span>
        </p>
      </header>

      <p id="publicEmpty" class="state" hidden>Esta coleção ainda não tem links.</p>

      <section class="group" data-status="Para Ler" aria-labelledby="groupParaLer" hidden>
        <h2 id="groupParaLer" class="group__title">Para Ler</h2>
        <ul class="public-list"></ul>
      </section>

      <section class="group" data-status="Lendo" aria-labelledby="groupLendo" hidden>
        <h2 id="groupLendo" class="group__title">Lendo</h2>
        <ul class="public-list"></ul>
      </section>

      <section class="group" data-status="Concluído" aria-labelledby="groupConcluido" hidden>
        <h2 id="groupConcluido" class="group__title">Concluído</h2>
        <ul class="public-list"></ul>
      </section>
    </article>
  </main>

  <noscript>
    <p class="noscript">Esta página precisa de JavaScript para funcionar.</p>
  </noscript>

  <footer id="projectFooter">Chave Única de Auditoria: <code>P26-2A-567B-6EC5-D24D-9098</code> · Turma 2A · Licenciado sob MIT</footer>

  <script type="module" src="/colecao.js"></script>
</body>
</html>
