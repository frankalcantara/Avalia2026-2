name: Encerrar Entregas, Avaliar Turma e Merge

on:
  workflow_dispatch:
    inputs:
      turma:
        description: 'Turma para avaliar e fazer merge (2A, 2B, 2C peso 7,5 | 3A peso 7,75)'
        required: true
        default: 'todas'
        type: choice
        options:
          - 'todas'
          - '2A'
          - '2B'
          - '2C'
          - '3A'
      reavaliar:
        description: 'Forçar reavaliação de alunos já avaliados (padrão: pular já avaliados)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  avaliar-e-encerrar:
    name: Avaliar Turma, Enviar Parecer por E-mail e Fazer Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório oficial (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Executar Avaliação Automática e Merge por Turma
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJETOS_VALIDATION_TOKEN: ${{ secrets.PROJETOS_VALIDATION_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          PROJETOS_API_BASE: ${{ vars.PROJETOS_API_BASE || 'https://frank-active-reader.frank-alcantara.workers.dev' }}
          TURMA_FILTRO: ${{ github.event.inputs.turma || 'todas' }}
          FORCE_REEVALUATE: ${{ github.event.inputs.reavaliar || 'false' }}
          PRAZO_LIMITE_ISO: ${{ vars.PRAZO_LIMITE_ISO || '2026-11-20T23:59:59-03:00' }}
        run: node .github/scripts/encerrar-avaliacoes.mjs
