<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cápsula do Tempo e Livro de Visitas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Cápsula do Tempo da Turma</h1>
    <div id="auth"></div>
  </header>

  <main>
    <p id="alert" class="alert" hidden></p>

    <section class="card">
      <h2>Mural público</h2>
      <form id="form-msg" hidden>
        <textarea id="msg-body" maxlength="500" required placeholder="Deixe seu depoimento (até 500 caracteres)"></textarea>
        <button type="submit">Publicar</button>
      </form>
      <p id="msg-hint" class="hint">Entre com o Discord para publicar no mural.</p>
      <ul id="messages" class="list"></ul>
    </section>

    <section class="card">
      <h2>Cápsulas do tempo</h2>
      <form id="form-cap" hidden>
        <input id="cap-title" maxlength="100" required placeholder="Título da cápsula">
        <textarea id="cap-body" maxlength="2000" required placeholder="Sua mensagem para o futuro"></textarea>
        <label>Destino
          <select id="cap-target">
            <option value="turma">Para a turma</option>
            <option value="self">Para mim mesmo(a)</option>
          </select>
        </label>
        <label>Desbloqueia em
          <input id="cap-date" type="datetime-local" required>
        </label>
        <button type="submit">Selar cápsula</button>
      </form>
      <p id="cap-hint" class="hint">Entre com o Discord para criar cápsulas.</p>
      <ul id="capsules" class="list"></ul>
    </section>
  </main>

  <footer>
    <p>Chave de auditoria: P26-2A-EF14-8523-68F5-EEDD</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
