name = "painel-tarefas-cloudflare"
main = "src/index.js"
compatibility_date = "2026-11-17"

[vars]
DISCORD_REDIRECT_URI = "https://painel-tarefas-cloudflare.painel-tarefas-cloudflare.workers.dev/api/auth/discord/callback"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "painel-tarefas-db"
database_id = "99250ac7-54d2-4613-bd94-afa109e13a0d"
migrations_dir = "migrations"
