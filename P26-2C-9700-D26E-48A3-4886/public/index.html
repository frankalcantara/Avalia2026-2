<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kudos Board — Mural de Reconhecimento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <h1>Kudos Board</h1>
      <div id="auth" class="auth"></div>
    </div>
  </header>

  <main class="wrap">
    <p id="flash" class="flash" role="status" hidden></p>

    <section class="card" id="login-card" hidden>
      <h2>Reconheça um colega</h2>
      <p>Entre com o Discord para enviar elogios públicos para as pessoas do time.</p>
      <a class="btn" href="/api/auth/discord">Entrar com Discord</a>
    </section>

    <section class="card" id="send-card" hidden>
      <h2>Enviar um reconhecimento</h2>
      <form id="kudos-form" novalidate>
        <label class="field">
          <span>Para quem?</span>
          <select id="to" required></select>
        </label>
        <fieldset class="field">
          <legend>Selo</legend>
          <div id="badges" class="chips"></div>
        </fieldset>
        <label class="field">
          <span>Mensagem</span>
          <textarea id="message" maxlength="280" rows="3" placeholder="Conte o que essa pessoa fez de bom..." required></textarea>
          <small id="counter">0/280</small>
        </label>
        <button class="btn" type="submit" id="send-btn">Enviar kudos</button>
      </form>
    </section>

    <section class="filters" aria-label="Filtros">
      <label>Perfil
        <select id="filter-profile"><option value="">Todos os perfis</option></select>
      </label>
      <label>Mostrar
        <select id="filter-mode">
          <option value="received">Recebidos</option>
          <option value="sent">Enviados</option>
        </select>
      </label>
    </section>

    <section id="board" class="board" aria-label="Mural de reconhecimentos" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Nenhum reconhecimento por aqui ainda.</p>
  </main>

  <footer class="footer">
    Chave Única de Auditoria: <code>P26-2C-9700-D26E-48A3-4886</code> · Turma 2C · Licenciado sob MIT
  </footer>

  <script src="app.js"></script>
</body>
</html>
