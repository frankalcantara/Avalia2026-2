<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto #40 - Timesheet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Cabeçalho e Autenticação Discord -->
    <header>
        <h1>Timesheet - Projetos de Software</h1>
        <div id="auth-section">
            <button id="btnLoginDiscord">Login com Discord</button>
            <div id="userInfo" style="display: none;">
                <img id="userAvatar" src="" alt="Avatar" width="32">
                <span id="userName">Usuário</span>
            </div>
        </div>
    </header>

    <main>
        <!-- Seção 1: Cronômetro em Tempo Real -->
        <section id="timer-section">
            <h2>Cronômetro (Tempo Real)</h2>
            <div id="displayTimer">00:00:00</div>
            <button id="btnStart">Iniciar</button>
            <button id="btnStop">Parar & Salvar</button>
        </section>

        <!-- Seção 2: Lançamento Manual -->
        <section id="manual-entry-section">
            <h2>Lançamento Manual</h2>
            <form id="formManual">
                <label for="faseProjeto">Etapa do Ciclo de Vida:</label>
                <select id="faseProjeto" required>
                    <option value="Requisitos">Requisitos</option>
                    <option value="Arquitetura">Arquitetura</option>
                    <option value="Codificacao">Codificação</option>
                    <option value="Testes">Testes</option>
                </select>

                <label for="horasTrabalhadas">Horas Gastas:</label>
                <input type="number" id="horasTrabalhadas" min="0.1" step="0.1" required>

                <button type="submit">Lançar Horas</button>
            </form>
        </section>

        <!-- Seção 3: Painel Analítico -->
        <section id="dashboard-section">
            <h2>Painel Analítico da Equipe</h2>
            <table id="tabelaDashboard">
                <thead>
                    <tr>
                        <th>Módulo/Etapa</th>
                        <th>Tempo Estimado (h)</th>
                        <th>Tempo Real (h)</th>
                        <th>Desvio</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo">
                    <!-- Os dados serão injetados aqui via JavaScript depois -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Rodapé com a Chave de Auditoria Obrigatória -->
    <footer>
        <p>Chave Única de Auditoria: P26-2A-72B9-56ED-0328-0872</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
